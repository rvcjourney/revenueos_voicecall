name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "$CHANGED"

          if echo "$CHANGED" | grep -q '^agent/'; then
            echo "agent=1" >> $GITHUB_OUTPUT
          else
            echo "agent=0" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -q '^backend/'; then
            echo "backend=1" >> $GITHUB_OUTPUT
          else
            echo "backend=0" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -q '^frontend/'; then
            echo "frontend=1" >> $GITHUB_OUTPUT
          else
            echo "frontend=0" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
          set -e
          cd /opt/motmvoice
          git pull origin main

          BUILD_AGENT=${{ steps.changes.outputs.agent }}
          BUILD_BACKEND=${{ steps.changes.outputs.backend }}
          BUILD_FRONTEND=${{ steps.changes.outputs.frontend }}

          SERVICES=""
          [ "$BUILD_AGENT"    = "1" ] && SERVICES="$SERVICES agent"
          [ "$BUILD_BACKEND"  = "1" ] && SERVICES="$SERVICES api"
          [ "$BUILD_FRONTEND" = "1" ] && SERVICES="$SERVICES frontend"

          if [ -n "$SERVICES" ]; then
            echo "Rebuilding:$SERVICES"
            docker compose up -d --build $SERVICES
          else
            echo "No service code changed — restarting containers"
            docker compose up -d
          fi

          echo "Deploy complete ✓"
          ENDSSH
