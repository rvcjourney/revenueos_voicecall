name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  # ── Lint & syntax check ─────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    # tests/conftest.py + pyproject.toml's [tool.pytest.ini_options] hardcode
    # DATABASE_URL=postgresql://motm:test@localhost:5432/motmvoice_test — the
    # test suite (added by the SaaS-platform merge) needs a real Postgres to
    # create/drop tables against. Without this service every push touching
    # backend/ or agent/ fails here with "password authentication failed for
    # user motm" before a single test even runs, which silently skips the
    # deploy job below (it `needs: lint`) — code merged to main never reaches
    # the VPS even though the push itself looks successful on GitHub.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: motm
          POSTGRES_PASSWORD: test
          POSTGRES_DB: motmvoice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Check syntax (pyflakes)
        run: |
          cd backend
          python -m pyflakes app/ || true

      - name: Run backend tests
        run: |
          cd backend
          python -m pytest tests/ -q --no-header --tb=short

      # agent/ had zero test coverage until the 2026-08-24 readiness-audit
      # follow-up (agent/tests/) -- wired in here so deploy is actually
      # gated on it, not just on backend/. No Postgres/network needed: these
      # are pure regex/text-transform/retry-logic unit tests against
      # agent.py directly.
      - name: Install agent dependencies
        run: pip install -r agent/requirements.txt

      - name: Run agent tests
        run: |
          cd agent
          python -m pytest tests/ -q --no-header --tb=short

  # ── Frontend build, lint, type-check, and test ──────────────────────────────
  # Previously nothing gated a frontend deploy on any of this -- a broken
  # build or failing test could still reach the VPS as long as backend/agent
  # were fine, since `deploy` only ever needed the Python-only `lint` job.
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/motm-voice-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/motm-voice-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Run tests
        run: npm test

  # ── Deploy ──────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [lint, frontend-checks]

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
          set -e
          cd ~/motmvoice/motmvoice

          # Diff against what THIS SERVER currently has checked out, not what
          # GitHub Actions assumes (previously `HEAD~1 HEAD` in a separate job
          # step — that undercounts whenever an earlier push's lint job failed
          # and never deployed, or when a push bundles more than one commit,
          # since only the last commit's diff was ever examined). Computing it
          # here means every change since the VPS's last successful deploy is
          # always caught, regardless of how many commits or failed runs sit
          # in between.
          PRE_PULL_SHA=$(git rev-parse HEAD)

          # Authenticate this pull inline instead of persisting the token into the
          # 'origin' remote — that used to overwrite any manually-configured PAT
          # (used for ad-hoc pulls on the VPS) with this run's short-lived CI token,
          # breaking manual `git pull` once the CI token expired (~1h).
          git pull "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/motmautomation2026/MOTM-AI-VOICE-CALL.git" main

          CHANGED=$(git diff --name-only "$PRE_PULL_SHA" HEAD)
          echo "Changed since last deploy:"
          echo "$CHANGED"

          # Rebuild api image first so migrations always run on fresh code
          echo "Building api image..."
          docker compose build api
          echo "Build complete ✓"

          # Run database migrations before starting services
          echo "Running database migrations..."
          docker compose run --rm --no-deps api alembic upgrade head
          echo "Migrations complete ✓"

          BUILD_AGENT=0; BUILD_BACKEND=0; BUILD_FRONTEND=0; BUILD_LANDING=0
          echo "$CHANGED" | grep -q '^agent/'         && BUILD_AGENT=1
          echo "$CHANGED" | grep -q '^backend/'       && BUILD_BACKEND=1
          echo "$CHANGED" | grep -q '^frontend/'      && BUILD_FRONTEND=1
          # Note the space in the path itself ("landing page/") -- quoted so
          # grep matches it literally instead of treating it as two patterns.
          echo "$CHANGED" | grep -q '^landing page/'  && BUILD_LANDING=1

          SERVICES=""
          [ "$BUILD_AGENT"    = "1" ] && SERVICES="$SERVICES agent"
          [ "$BUILD_BACKEND"  = "1" ] && SERVICES="$SERVICES api worker beat"
          [ "$BUILD_FRONTEND" = "1" ] && SERVICES="$SERVICES frontend"
          [ "$BUILD_LANDING"  = "1" ] && SERVICES="$SERVICES landing"

          if [ -n "$SERVICES" ]; then
            echo "Rebuilding:$SERVICES"
            docker compose up -d --build $SERVICES
          else
            echo "No service code changed — restarting containers"
            docker compose up -d
          fi

          # Wait for containers to pass health checks
          echo "Waiting for services to become healthy..."
          sleep 15
          UNHEALTHY=$(docker compose ps --format json 2>/dev/null | \
            python3 -c "
          import sys, json
          lines = sys.stdin.read().strip().split('\n')
          bad = []
          for line in lines:
              try:
                  c = json.loads(line)
                  h = c.get('Health', '')
                  if h == 'unhealthy':
                      bad.append(c.get('Name', '?'))
              except Exception:
                  pass
          if bad:
              print('UNHEALTHY: ' + ', '.join(bad))
              exit(1)
          " 2>&1) && echo "All services healthy ✓" || { echo "$UNHEALTHY"; exit 1; }

          echo "Deploy complete ✓"
          ENDSSH
