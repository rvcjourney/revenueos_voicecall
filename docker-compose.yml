# MOTMVoice — Production Compose
# Database: Supabase Cloud (no local postgres needed)
# Hostinger hPanel Caddy handles HTTPS and reverse proxy.
#
# Deploy:  docker compose up -d --build
# Logs:    docker compose logs -f
# Restart: docker compose restart api

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motm-api
    restart: always
    env_file: ./backend/.env
    environment:
      - ENVIRONMENT=production
      - DOCS_ENABLED=false
      - DEBUG=false
      - 'CORS_ORIGINS=["https://app.quickhowl.com","https://quickhowl.com"]'
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    ports:
      - "7000:8000"
    networks:
      - motm
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "4.0"

  # ── Celery Worker (background tasks) ────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motm-worker
    restart: always
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    networks:
      - motm
    command: >
      celery -A app.workers.celery_app worker
      --concurrency 20
      --loglevel info
      --queues calls,campaigns,exports,default
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Array-form CMD never invokes a shell, so $$HOSTNAME was never actually
      # substituted -- celery was being asked to ping a worker literally named
      # "celery@$HOSTNAME", which never matches its real name and always timed
      # out. CMD-SHELL runs this through /bin/sh, where $HOSTNAME (after
      # compose's own $$->$ unescaping) resolves to the container's real
      # hostname, matching what celery reports as its own worker name.
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # Raised alongside --concurrency 10->20 above: Celery's default pool
          # is prefork (one real OS process per concurrency slot, not a
          # lightweight async task), so doubling concurrency roughly doubles
          # this container's worst-case memory footprint. 3g assumes the VPS
          # has real headroom beyond every other service's own limit in this
          # file -- check `docker stats` after deploying, and dial concurrency
          # back down if this container is ever memory-pressured in practice.
          memory: 3g
          cpus: "2.0"

  # ── Celery Beat (scheduled tasks) ────────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motm-beat
    restart: always
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    networks:
      - motm
    volumes:
      - beat_data:/var/lib/celerybeat
    command: >
      celery -A app.workers.celery_app beat
      --loglevel info
      --scheduler celery.beat:PersistentScheduler
      --schedule /var/lib/celerybeat/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # No override here previously meant this inherited the Dockerfile's
      # baked-in HEALTHCHECK (curl http://localhost:8000/health) -- beat
      # doesn't serve HTTP at all, so it always failed. Beat has no RPC
      # control interface to "ping" the way a worker does (no `celery
      # inspect` equivalent for the scheduler), so instead check that its
      # schedule file was touched recently -- it rewrites this on every
      # tick, and the shortest task in beat_schedule runs every 60s, so a
      # live beat process should never go more than ~120s without a write.
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /var/lib/celerybeat/celerybeat-schedule) )) -lt 120"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  # ── Frontend (React + Vite dashboard) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/motm-voice-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://app.quickhowl.com
    container_name: motm-frontend
    restart: always
    ports:
      - "6001:6001"
    networks:
      - motm
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"

  # ── Landing page (marketing site, quickhowl.com) ─────────────────────────────
  landing:
    build:
      context: ./landing page/quickhowl-landing
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://app.quickhowl.com
        VITE_EXISTING_APP_LOGIN_URL: https://app.quickhowl.com/login
        VITE_EXISTING_APP_SIGNUP_URL: https://app.quickhowl.com/signup
    container_name: motm-landing
    restart: always
    ports:
      - "6002:6002"
    networks:
      - motm
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ── Voice Agent (LiveKit) ────────────────────────────────────────────────────
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: motm-agent
    restart: always
    env_file: ./agent/.env
    environment:
      - PYTHONUNBUFFERED=1
    command: python -u agent.py start
    networks:
      - motm
    depends_on:
      - redis
    # Without this, Docker's default 10s stop timeout SIGKILLs this process on
    # every deploy/restart -- well before the livekit-agents SDK's own SIGTERM
    # handling (agents.cli.run_app -> AgentServer.drain(), default
    # drain_timeout=1800s in myenv311/.../livekit/agents/worker.py) gets a
    # chance to let in-progress calls finish. 650s clears this codebase's own
    # outbound max-call-duration guard (agent.py's _max_duration_guard, 600s)
    # with a small margin. NOTE: inbound calls are NOT covered by that same
    # guard -- InboundAgentTemplate.max_call_duration_seconds (app/schemas/
    # inbound_agent.py) defaults to 600 but has no upper bound, so an org that
    # configures a longer inbound max duration can still have a live inbound
    # call SIGKILLed by a deploy landing after this window elapses.
    stop_grace_period: 650s
    deploy:
      resources:
        limits:
          # Was 2g -- live docker stats on the deployed VPS showed ~1.27GB used
          # (63%) at idle/baseline (this container keeps STT/TTS/VAD clients
          # loaded even with no active call), leaving little room to grow into
          # more simultaneous live calls without risking an OOM kill mid-call.
          # 4g on a 32GB-RAM VPS with ~9.5GB already committed elsewhere still
          # leaves large headroom for the host OS/Docker itself.
          memory: 4g
          cpus: "6.0"

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: motm-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - motm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 300m

  # ── MinIO (object storage) ───────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: motm-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - motm
    # No ports exposed — MinIO is internal only; accessed via http://minio:9000 inside the Docker network.
    # The console (port 9001) is also not exposed; use `docker compose exec minio mc` for admin tasks.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  motm:
    driver: bridge
    ipam:
      config:
        - subnet: 10.60.0.0/24

volumes:
  redis_data:
  minio_data:
  beat_data:
