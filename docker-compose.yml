# MOTMVoice — Production Compose
# Database: Supabase Cloud (no local postgres needed)
# Hostinger hPanel Caddy handles HTTPS and reverse proxy.
#
# Deploy:  docker compose up -d --build
# Logs:    docker compose logs -f
# Restart: docker compose restart api

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motm-api
    restart: always
    env_file: ./backend/.env
    environment:
      - ENVIRONMENT=production
      - DOCS_ENABLED=false
      - DEBUG=false
      - 'CORS_ORIGINS=["https://app.quickhowl.com","https://quickhowl.com"]'
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # Without this, Python fully block-buffers stdout whenever it isn't a
      # TTY (always true under Docker) -- app/core/logging.py's structlog
      # handler writes to stdout, not stderr (unlike Celery's own default
      # logger, which explicitly targets stderr and is unbuffered regardless).
      # This container only ever "worked" by accident: enough request/
      # healthcheck traffic happens to fill and flush the buffer on its own.
      # Confirmed missing on worker/beat below caused their structlog output
      # (including sentry_initialized) to never appear in `docker compose
      # logs` at all, even though it ran successfully -- agent already had
      # this set for the same reason.
      - PYTHONUNBUFFERED=1
    ports:
      - "7000:8000"
    networks:
      - motm
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "4.0"

  # ── Celery Worker (background tasks) ────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motm-worker
    restart: always
    env_file: ./backend/.env
    environment:
      # Only the api service set this explicitly before -- worker/beat fell
      # back to Settings' "development" default (backend/.env apparently
      # doesn't set it either), confirmed live: their logs were rendering
      # via structlog's colorized dev console renderer instead of JSON like
      # api, and app/config.py's production-only validation checks (DEBUG/
      # DOCS_ENABLED/SENTRY_DSN) were silently skipping these two processes.
      # DOCS_ENABLED/DEBUG MUST travel together with ENVIRONMENT=production --
      # Settings._validate_production hard-fails startup if ENVIRONMENT is
      # "production" but DOCS_ENABLED/DEBUG aren't also explicitly set (their
      # class defaults are DOCS_ENABLED=True, DEBUG=False -- backend/.env
      # doesn't override DOCS_ENABLED either, only api's own environment
      # block did). Confirmed live: adding ENVIRONMENT=production alone
      # crash-looped both worker and beat on this exact validation error.
      - ENVIRONMENT=production
      - DOCS_ENABLED=false
      - DEBUG=false
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # See the api service's identical setting above for why -- confirmed
      # via a live deploy that without this, structlog output (including
      # the new worker_process_init Sentry-init log line) silently never
      # reached `docker compose logs` even though it ran successfully.
      - PYTHONUNBUFFERED=1
    networks:
      - motm
    command: >
      celery -A app.workers.celery_app worker
      --concurrency 20
      --loglevel info
      --queues calls,campaigns,exports,default
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Array-form CMD never invokes a shell, so $$HOSTNAME was never actually
      # substituted -- celery was being asked to ping a worker literally named
      # "celery@$HOSTNAME", which never matches its real name and always timed
      # out. CMD-SHELL runs this through /bin/sh, where $HOSTNAME (after
      # compose's own $$->$ unescaping) resolves to the container's real
      # hostname, matching what celery reports as its own worker name.
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # Raised alongside --concurrency 10->20 above: Celery's default pool
          # is prefork (one real OS process per concurrency slot, not a
          # lightweight async task), so doubling concurrency roughly doubles
          # this container's worst-case memory footprint. 3g assumes the VPS
          # has real headroom beyond every other service's own limit in this
          # file -- check `docker stats` after deploying, and dial concurrency
          # back down if this container is ever memory-pressured in practice.
          memory: 3g
          cpus: "2.0"

  # ── Celery Beat (scheduled tasks) ────────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motm-beat
    restart: always
    env_file: ./backend/.env
    environment:
      # See the worker service's identical settings above for why -- all
      # three must travel together or Settings._validate_production
      # hard-fails startup.
      - ENVIRONMENT=production
      - DOCS_ENABLED=false
      - DEBUG=false
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # See the api service's identical setting above for why.
      - PYTHONUNBUFFERED=1
    networks:
      - motm
    volumes:
      - beat_data:/var/lib/celerybeat
    command: >
      celery -A app.workers.celery_app beat
      --loglevel info
      --scheduler celery.beat:PersistentScheduler
      --schedule /var/lib/celerybeat/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # No override here previously meant this inherited the Dockerfile's
      # baked-in HEALTHCHECK (curl http://localhost:8000/health) -- beat
      # doesn't serve HTTP at all, so it always failed. Beat has no RPC
      # control interface to "ping" the way a worker does (no `celery
      # inspect` equivalent for the scheduler), so instead check that its
      # schedule file was touched recently -- it rewrites this on every
      # tick, and the shortest task in beat_schedule runs every 60s, so a
      # live beat process should never go more than ~120s without a write.
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /var/lib/celerybeat/celerybeat-schedule) )) -lt 120"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  # ── Frontend (React + Vite dashboard) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/motm-voice-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://app.quickhowl.com
    container_name: motm-frontend
    restart: always
    ports:
      - "6001:6001"
    networks:
      - motm
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"

  # ── Landing page (marketing site, quickhowl.com) ─────────────────────────────
  landing:
    build:
      context: ./landing page/quickhowl-landing
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://app.quickhowl.com
        VITE_EXISTING_APP_LOGIN_URL: https://app.quickhowl.com/login
        VITE_EXISTING_APP_SIGNUP_URL: https://app.quickhowl.com/signup
    container_name: motm-landing
    restart: always
    ports:
      - "6002:6002"
    networks:
      - motm
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ── Voice Agent (LiveKit) ────────────────────────────────────────────────────
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    # No fixed container_name -- required for replicas: 2 below (Compose can't
    # give two containers the same explicit name; it auto-names each replica
    # instead, e.g. motmvoice-agent-1/-2). Nothing else in this repo referenced
    # the old "motm-agent" name directly -- `docker compose logs/up agent`
    # (README's runbook) already operate on the service name and work
    # unchanged across however many replicas are running.
    restart: always
    env_file: ./agent/.env
    environment:
      - PYTHONUNBUFFERED=1
    command: python -u agent.py start
    networks:
      - motm
    depends_on:
      - redis
    # Without this, Docker's default 10s stop timeout SIGKILLs this process on
    # every deploy/restart -- well before the livekit-agents SDK's own SIGTERM
    # handling (agents.cli.run_app -> AgentServer.drain(), DRAIN_TIMEOUT in
    # livekit/agents/worker.py -- confirmed 1800s under 1.5.7, 3600s under
    # 1.7.0; agent/requirements.txt pins no upper bound on livekit-agents, so
    # which one actually applies depends on when the image was last built, not
    # anything pinned in this repo) gets a chance to let in-progress calls
    # finish. This value doesn't need to match that SDK default -- it only
    # needs to clear how long a call here can actually run: 650s covers this
    # codebase's own outbound max-call-duration guard (agent.py's
    # _max_duration_guard, 600s) with a small margin. NOTE: inbound calls are
    # NOT covered by that same guard -- InboundAgentTemplate.
    # max_call_duration_seconds (app/schemas/inbound_agent.py) defaults to 600
    # but has no upper bound, so an org that configures a longer inbound max
    # duration can still have a live inbound call SIGKILLed by a deploy
    # landing after this window elapses.
    stop_grace_period: 650s
    deploy:
      # Was a single instance -- every live call's session state lives only in
      # this process's memory (confirmed: no DB access, no shared session
      # store -- see app/api/agent_internal.py's HTTP-only integration), so a
      # crash or OOM dropped every concurrent call at once with nothing to
      # fail over to. 2 replicas means a single crashed/OOMed instance now
      # only takes down whatever calls THAT process happened to be handling.
      # LiveKit assigns each process its own server-side worker_id on
      # registration (myenv311/.../livekit/agents/worker.py) -- confirmed
      # this is the SDK's intended scale-out path, no code change needed for
      # two independent processes to register under the same agent_name.
      replicas: 2
      resources:
        limits:
          # Per-replica, not shared -- Compose applies `limits` to each
          # container independently. Halved from the single-instance 6.0
          # vCPU so the service's TOTAL CPU ceiling (3.0 x 2 = 6.0) stays
          # exactly what it was before, rather than doubling on top of the
          # CPU oversubscription the 2026-08-23 audit already flagged
          # (committed limits summing to ~14.5 vCPU against the real 8 vCPU
          # host). Memory is NOT halved: each replica independently loads its
          # own STT/TTS/VAD models (confirmed ~1.27GB/63% of the old 2g limit
          # at idle, per the single-instance note this replaces), so splitting
          # the same total in half would risk an OOM at idle before either
          # replica takes a single call. Total memory commitment goes from 4g
          # to 6g as a result -- watch `docker stats` after deploying under
          # real concurrent-call load and adjust if the VPS is pressured.
          memory: 3g
          cpus: "3.0"

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: motm-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - motm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 300m

  # ── MinIO (object storage) ───────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: motm-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - motm
    # No ports exposed — MinIO is internal only; accessed via http://minio:9000 inside the Docker network.
    # The console (port 9001) is also not exposed; use `docker compose exec minio mc` for admin tasks.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  motm:
    driver: bridge
    ipam:
      config:
        - subnet: 10.60.0.0/24

volumes:
  redis_data:
  minio_data:
  beat_data:
