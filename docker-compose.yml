# MOTMVoice — Production Compose
# Database: Supabase Cloud (no local postgres needed)
# Hostinger hPanel Caddy handles HTTPS and reverse proxy.
#
# Deploy:  docker compose up -d --build
# Logs:    docker compose logs -f
# Restart: docker compose restart api

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motm-api
    restart: always
    env_file: ./backend/.env
    environment:
      - ENVIRONMENT=production
      - DOCS_ENABLED=false
      - DEBUG=false
      - 'CORS_ORIGINS=["https://motmvoice.b2botix.ai","http://72.60.99.90:6001"]'
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    ports:
      - "7000:8000"
    networks:
      - motm
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "4.0"

  # ── Celery Worker (background tasks) ────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motm-worker
    restart: always
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    networks:
      - motm
    command: >
      celery -A app.workers.celery_app worker
      --concurrency 10
      --loglevel info
      --queues calls,campaigns,exports,default
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

  # ── Celery Beat (scheduled tasks) ────────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motm-beat
    restart: always
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    networks:
      - motm
    command: >
      celery -A app.workers.celery_app beat
      --loglevel info
      --scheduler celery.beat:PersistentScheduler
      --schedule /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  # ── Frontend (TanStack Start / React) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend/motmvoice-main
      dockerfile: Dockerfile
    container_name: motm-frontend
    restart: always
    environment:
      - VITE_API_URL=https://motmvoice.b2botix.ai
    ports:
      - "6001:6001"
    networks:
      - motm
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"

  # ── Voice Agent (LiveKit) ────────────────────────────────────────────────────
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: motm-agent
    restart: always
    env_file: ./agent/.env
    environment:
      - PYTHONUNBUFFERED=1
    command: python -u agent.py start
    networks:
      - motm
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: motm-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - motm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 300m

  # ── MinIO (object storage) ───────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: motm-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
    networks:
      - motm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  motm:
    driver: bridge
    ipam:
      config:
        - subnet: 10.60.0.0/24

volumes:
  redis_data:
  minio_data:
