# MOTMVoice — Production Overrides
# Applies on top of docker-compose.yml for production deployments.
#
# Deploy:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Restart: docker compose -f docker-compose.yml -f docker-compose.prod.yml restart api
# Logs:    docker compose -f docker-compose.yml -f docker-compose.prod.yml logs -f

services:

  api:
    restart: always
    environment:
      - ENVIRONMENT=production
      - DOCS_ENABLED=false
      - DEBUG=false
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "4.0"

  # ── Celery Worker (background tasks) ────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motm-worker
    restart: always
    env_file: ./backend/.env
    command: >
      celery -A app.workers.celery_app worker
      --concurrency 4
      --loglevel info
      --queues calls,campaigns,exports,default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"

  # ── Celery Beat (scheduled tasks — run exactly one instance) ─────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motm-beat
    restart: always
    env_file: ./backend/.env
    command: >
      celery -A app.workers.celery_app beat
      --loglevel info
      --scheduler celery.beat:PersistentScheduler
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  agent:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  postgres:
    restart: always
    ports: []   # no host exposure in production

  redis:
    restart: always
    ports: []   # no host exposure in production

  minio:
    restart: always
    ports:
      - "9000:9000"   # keep S3 API; no console port in production

  caddy:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
